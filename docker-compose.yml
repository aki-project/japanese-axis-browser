services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: japanesesite
      # Read from .env when set. Postgres applies it only when the data
      # volume is first created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-japanesesite}
      POSTGRES_DB: japanesesite
    ports:
      # Loopback only: published on all interfaces, Docker's own firewall
      # rules would expose the database to the network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
